<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent | Query IT Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A; --card-solid:#1E293B; --border:#1E293B;
    --text:#F1F5F9; --text-muted:#94A3B8;
    --sky:#38BDF8; --sky-dark:#0EA5E9; --sky-bg:rgba(56,189,248,0.1);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px;}
  .card{max-width:480px;text-align:center;background:var(--card-solid);border:1px solid var(--border);border-radius:16px;padding:48px 36px;}
  .icon{width:56px;height:56px;background:var(--sky-bg);color:var(--sky);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 24px;}
  h1{font-size:24px;font-weight:800;color:#fff;margin:0 0 12px;}
  p{color:var(--text-muted);font-size:15px;margin:0 0 28px;}
  .btn{display:inline-block;padding:12px 24px;border-radius:8px;background:var(--sky);color:#0f172a;
    font-weight:700;font-size:14.5px;text-decoration:none;}
  .btn:hover{background:var(--sky-dark);}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Message sent</h1>
    <p>Thanks for reaching out — I'll get back to you within a couple of business days.</p>
    <a href="./" class="btn">Back to site</a>
  </div>
</body>
</html>
